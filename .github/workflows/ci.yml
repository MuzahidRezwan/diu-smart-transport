name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Project secret guard (tree + full history)
        run: node scripts/check-secrets.mjs --all && node scripts/check-secrets.mjs --history
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  node:
    name: Shared, API and web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @diu/shared
      - run: npm test -w @diu/shared
      - run: npm run typecheck -w @diu/api
      - run: npm test -w @diu/api
      - run: npm run build -w @diu/web
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  ml:
    name: ML service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ml/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund && npm run build -w @diu/shared
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      - run: npx tsc --noEmit
        working-directory: apps/mobile
