<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIU Smart Transport Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: authority console = left rail + scannable panels; user app = phone frame beside notes. */
:root {
  --bg: #f2f5fb;
  --surface: #ffffff;
  --surface-2: #eaf0f9;
  --ink: #0e1a33;
  --muted: #5a6784;
  --line: #d9e1ee;
  --accent: #1446a0;
  --accent-ink: #ffffff;
  --accent-soft: #e2ebfb;
  --ok: #1d8049; --ok-soft: #dff3e7;
  --warn: #a8690f; --warn-soft: #fbefd9;
  --crit: #bf3328; --crit-soft: #fbe3e0;
  --op-h: #4f46e5; --op-m: #0b8f83; --op-s: #d9620c;
  --river: #cfe0f6;
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(14, 26, 51, .06), 0 8px 24px rgba(14, 26, 51, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a111e; --surface: #111a2b; --surface-2: #18233a; --ink: #e6ecf7; --muted: #96a3bf; --line: #24304a;
    --accent: #78a3f2; --accent-ink: #0a111e; --accent-soft: #1a2a4b;
    --ok: #4cc283; --ok-soft: #12301f; --warn: #e6b553; --warn-soft: #33270f; --crit: #f0766a; --crit-soft: #3b1815;
    --op-h: #928cff; --op-m: #33c9b8; --op-s: #ff9a52; --river: #1b3150;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a111e; --surface: #111a2b; --surface-2: #18233a; --ink: #e6ecf7; --muted: #96a3bf; --line: #24304a;
  --accent: #78a3f2; --accent-ink: #0a111e; --accent-soft: #1a2a4b;
  --ok: #4cc283; --ok-soft: #12301f; --warn: #e6b553; --warn-soft: #33270f; --crit: #f0766a; --crit-soft: #3b1815;
  --op-h: #928cff; --op-m: #33c9b8; --op-s: #ff9a52; --river: #1b3150;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 500 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 18px; } h3 { font-size: 15px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.ico { width: 18px; height: 18px; flex: none; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.stack { display: grid; gap: 12px; }

/* prototype bar */
.protobar { position: sticky; top: 0; z-index: 30; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; }
.protonote { font-size: 12px; color: var(--muted); }

/* controls */
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 9px; cursor: pointer; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-danger { color: var(--crit); }
.btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.input { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 10px; width: 100%; }
label.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 700; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.pill.none { background: var(--surface-2); color: var(--muted); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--crit); color: #fff; font-size: 11px; font-weight: 800; display: inline-grid; place-items: center; }
.badge.soft { background: var(--accent-soft); color: var(--accent); }

.bus { display: inline-flex; align-items: center; gap: 5px; font: 600 12px/1 var(--font-mono); padding: 5px 8px; border-radius: 7px; border: 1px solid transparent; white-space: nowrap; }
.bus::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--op); }
.bus.op-H { --op: var(--op-h); } .bus.op-M { --op: var(--op-m); } .bus.op-S { --op: var(--op-s); }
.bus { background: color-mix(in srgb, var(--op) 12%, var(--surface)); color: var(--ink); }
button.bus { cursor: pointer; border-color: color-mix(in srgb, var(--op) 30%, var(--line)); }
button.bus[aria-pressed="true"] { background: var(--op); color: #fff; }
button.bus[aria-pressed="true"]::before { background: #fff; }
button.bus[disabled] { opacity: .4; cursor: not-allowed; text-decoration: line-through; }
.bus .cap { font-weight: 500; opacity: .75; }

table.data { width: 100%; border-collapse: collapse; }
table.data th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 800; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
.table-wrap { overflow-x: auto; }
.wave-row td { background: var(--surface-2); font-weight: 800; font-size: 12px; color: var(--muted); padding: 6px 10px; }

/* authority layout */
.console { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 53px); }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 53px; height: calc(100vh - 53px); overflow-y: auto; }
.rail-group { display: grid; gap: 2px; }
.rail-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; padding: 0 10px 4px; }
.rail button { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--ink); }
.rail button:hover { background: var(--surface-2); }
.rail button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.rail .ico { width: 18px; height: 18px; flex: none; opacity: .8; }
.main { padding: 18px 22px 40px; display: grid; gap: 16px; align-content: start; min-width: 0; }

.header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.avatar { width: 46px; height: 46px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 16px var(--font-display); flex: none; }
.header h1 { font-size: 20px; }
.status-dots { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-weight: 700; }
.status-dots span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 5px; }

.day-banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }

.pred-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.pred-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.tile { background: var(--surface-2); border-radius: 10px; padding: 12px; }
.tile .label { font-size: 12px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.tile .big { font: 700 30px/1.1 var(--font-display); font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
.tile .sub { font-size: 12px; color: var(--muted); }
.req-table td:first-child { font-weight: 700; }
.req-table .na { color: var(--crit); font-size: 11px; font-weight: 700; }

.coverage { display: flex; gap: 8px; flex-wrap: wrap; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; }
.bar.ok > i { background: var(--ok); } .bar.crit > i { background: var(--crit); } .bar.warn > i { background: var(--warn); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 10px 12px; cursor: pointer; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab-body { padding-top: 14px; }

.feed-item { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.feed-item:last-child { border-bottom: 0; }

/* map */
.map-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 14px; }
.map { width: 100%; height: auto; display: block; border-radius: 10px; background: var(--surface-2); }
.map .route-line { fill: none; stroke: color-mix(in srgb, var(--muted) 45%, transparent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.map .route-line.hl { stroke: var(--accent); stroke-width: 4.5; }
.map .stop { fill: var(--surface); stroke: color-mix(in srgb, var(--muted) 70%, transparent); stroke-width: 1.5; }
.map text { font: 600 10px var(--font-body); fill: var(--muted); }
.map .dsc { fill: var(--accent); }
.map .bus-dot { stroke: var(--surface); stroke-width: 2; }
.map .bus-label { font: 700 9px var(--font-mono); fill: var(--ink); }
.map .grid { stroke: color-mix(in srgb, var(--muted) 12%, transparent); stroke-width: 1; }
.map .river { fill: none; stroke: var(--river); stroke-width: 12; stroke-linecap: round; }

/* drawer + modal */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 28, .45); z-index: 40; display: none; }
.scrim.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 50; transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column; border-left: 1px solid var(--line); }
.drawer.open { transform: none; }
.drawer-head { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.drawer-body { padding: 16px 18px; overflow-y: auto; display: grid; gap: 16px; flex: 1; align-content: start; }
.drawer-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
.modal { position: fixed; z-index: 50; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(980px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow: auto; background: var(--surface); border-radius: 14px; border: 1px solid var(--line); box-shadow: var(--shadow); display: none; }
.modal.open { display: block; }
.op-group { display: grid; gap: 8px; }
.op-group .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.option-chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.option { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--surface-2); }
.option b { font: 700 18px var(--font-display); display: block; }
.option.bad b { color: var(--crit); }

.toast-region { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 70; display: grid; gap: 8px; width: min(460px, calc(100% - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-weight: 700; box-shadow: var(--shadow); }

/* user app view */
.app-stage { display: grid; grid-template-columns: minmax(0, 390px) minmax(0, 1fr); gap: 28px; padding: 24px; max-width: 1180px; margin: 0 auto; align-items: start; }
.phone { width: 100%; max-width: 390px; height: 800px; border-radius: 40px; border: 10px solid #0d1424; background: var(--bg); position: relative; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; margin: 0 auto; }
.phone-status { display: flex; justify-content: space-between; padding: 10px 22px 4px; font: 700 12px var(--font-body); }
.phone-top { display: flex; align-items: center; gap: 10px; padding: 6px 14px 10px; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; position: relative; }
.icon-btn .badge { position: absolute; top: -6px; right: -6px; height: 18px; min-width: 18px; font-size: 10px; }
.phone-body { flex: 1; overflow-y: auto; padding: 4px 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; }
.phone-nav { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding: 6px 4px 12px; }
.phone-nav button { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--muted); padding: 6px 0; cursor: pointer; }
.phone-nav button[aria-current="page"] { color: var(--accent); }
.phone-nav svg { width: 22px; height: 22px; }
.p-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.next-bus { background: var(--accent); color: var(--accent-ink); border: 0; }
.next-bus .time { font: 700 40px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.next-bus .bus { background: color-mix(in srgb, var(--accent-ink) 92%, transparent); color: #0e1a33; }
.stops { display: flex; align-items: flex-start; gap: 0; overflow-x: auto; padding: 6px 0 2px; }
.stop-step { display: grid; justify-items: center; gap: 6px; min-width: 66px; text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); position: relative; }
.stop-step::before { content: ""; position: absolute; top: 6px; left: -50%; width: 100%; height: 2px; background: var(--line); z-index: 0; }
.stop-step:first-child::before { display: none; }
.stop-step i { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); z-index: 1; }
.stop-step:last-child i { background: var(--accent); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 82%; background: var(--surface); border-radius: 20px 20px 0 0; border-top: 1px solid var(--line); z-index: 6; padding: 16px; overflow-y: auto; display: grid; gap: 12px; box-shadow: 0 -10px 30px rgba(0,0,0,.18); }
.phone-scrim { position: absolute; inset: 0; background: rgba(8,14,28,.4); z-index: 5; }
.side-menu { position: absolute; top: 0; bottom: 0; left: 0; width: 78%; background: var(--surface); z-index: 6; padding: 22px 14px; display: grid; gap: 4px; align-content: start; }
.side-menu button { border: 0; background: transparent; text-align: left; padding: 11px 10px; border-radius: 10px; font-weight: 700; cursor: pointer; }
.side-menu button:hover { background: var(--surface-2); }
.id-card { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.id-card-top { background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--op-m))); color: #fff; padding: 14px; display: flex; gap: 12px; align-items: center; }
.photo { width: 64px; height: 76px; border-radius: 10px; background: rgba(255,255,255,.2); display: grid; place-items: center; font: 700 22px var(--font-display); border: 2px solid rgba(255,255,255,.5); flex: none; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; padding: 14px; font-size: 13px; }
.kv dt { color: var(--muted); font-weight: 700; }
.kv dd { margin: 0; font-weight: 700; }
.qr-box { display: grid; justify-items: center; gap: 6px; padding: 0 14px 16px; }
.qr-box canvas { width: 180px; height: 180px; image-rendering: pixelated; background: #fff; padding: 8px; border-radius: 10px; }
.notes { display: grid; gap: 16px; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.locked { display: grid; place-items: center; text-align: center; gap: 10px; padding: 30px 16px; color: var(--muted); }

@media (max-width: 1080px) {
  .pred-grid { grid-template-columns: 1fr; }
  .map-wrap { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .console { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .rail-group { display: flex; }
  .rail-label { display: none; }
  .rail button { white-space: nowrap; }
  .main { padding: 14px 16px 40px; }
  .app-stage { grid-template-columns: 1fr; padding: 16px; }
  .option-chips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 420px) {
  .phone { height: 720px; border-width: 6px; border-radius: 28px; }
  .pred-nums { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .drawer { transition: none; }
}
</style>
</head>
<body>
<header class="protobar">
  <div class="brand"><span class="brand-mark">DIU</span><span>Smart Transport</span></div>
  <div class="seg" role="group" aria-label="Choose view">
    <button data-act="view" data-view="authority" aria-pressed="true">Authority dashboard</button>
    <button data-act="view" data-view="student" aria-pressed="false">Student app</button>
    <button data-act="view" data-view="faculty" aria-pressed="false">Faculty app</button>
  </div>
  <span class="spacer"></span>
  <span class="protonote">Clickable prototype · sample data · demo time Thu 19 Nov 2026, 4:12 PM</span>
</header>

<div id="view-authority"></div>
<div id="view-student" hidden></div>
<div id="view-faculty" hidden></div>

<div class="scrim" id="scrim" data-act="close-overlays"></div>
<aside class="drawer" id="drawer" aria-label="Allocate buses" aria-hidden="true"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Next 7 days prediction"></div>
<div class="toast-region" id="toasts" aria-live="polite"></div>

<script>
/* ---------- sample data ---------- */
const OPS = {
  H: { name: 'Hanif', type: 'Volvo-type', cap: 40 },
  M: { name: 'Monir', type: 'City bus', cap: 36 },
  S: { name: 'Surjomukhi', type: 'Mini', cap: 30 }
};
const DRIVERS = ['Abdul Karim', 'Jalal Uddin', 'Mizanur Rahman', 'Shahidul Islam', 'Rafiq Mia', 'Nurul Haque', 'Babul Hossain', 'Selim Reza', 'Harun Or Rashid', 'Faruk Ahmed', 'Kawsar Ali', 'Monir Hossain'];
const FLEET = [];
function addBuses(op, nums, pool) {
  nums.forEach((n) => {
    const i = FLEET.length;
    FLEET.push({ code: `${op}-${String(n).padStart(2, '0')}`, op, cap: OPS[op].cap, pool,
      driver: DRIVERS[i % DRIVERS.length], phone: `01${(7 + (i % 3))}${String(10000000 + i * 7919).slice(0, 8)}` });
  });
}
addBuses('H', [10, 12, 14, 15, 16, 18, 20, 22, 24, 25, 27, 29], 'student');
addBuses('H', [30, 31, 33], 'faculty');
addBuses('M', [3, 5, 8, 10, 11, 12, 13, 15, 17, 19], 'student');
addBuses('M', [20, 21, 22], 'faculty');
addBuses('S', [1, 2, 3, 5, 7, 9, 11, 12], 'student');
const UNAVAILABLE = { 0: { 'M-15': 'Engine repair', 'S-09': 'Operator leave' }, 2: { 'H-18': 'Fitness renewal' }, 3: { 'M-15': 'Engine repair' }, 5: { 'S-02': 'Tyre change' } };

/* ---------- allocation logic ---------- */
function allocKey(day, key) { return `${day}|${key}`; }
function getAlloc(day, key) { return state.alloc[allocKey(day, key)]; }
function isUnavailable(code, day) { return Boolean((UNAVAILABLE[day] || {})[code]); }
function busConflict(code, day, slot) {
  const [a0, a1] = slotWindow(slot);
  for (const s of slotsFor(day)) {
    if (s.key === slot.key) continue;
    const al = getAlloc(day, s.key);
    if (!al || !al.buses.includes(code)) continue;
    const [b0, b1] = slotWindow(s);
    if (a0 < b1 && b0 < a1) return s;
  }
  return null;
}
function freeBuses(day, slot) {
  return FLEET.filter((b) => b.pool === slot.aud && !isUnavailable(b.code, day) && !busConflict(b.code, day, slot));
}
function seatsOf(codes) { return codes.reduce((t, c) => t + (FLEET.find((b) => b.code === c)?.cap || 0), 0); }
/** Fewest buses first, then least empty seats: largest buses until the remainder fits one bus, then the smallest bus that covers it. */
function pickBuses(target, pool) {
  const avail = [...pool].sort((a, b) => b.cap - a.cap);
  const chosen = []; let seats = 0;
  while (seats < target && avail.length) {
    const need = target - seats;
    const fit = [...avail].reverse().find((b) => b.cap >= need);
    const bus = fit || avail[0];
    chosen.push(bus); seats += bus.cap; avail.splice(avail.indexOf(bus), 1);
  }
  return { buses: chosen, seats, ok: seats >= target };
}

  const only = Object.keys(OPS).map((op) => {
    const n = Math.ceil(seats / OPS[op].cap);
    const have = pool.filter((b) => b.op === op).length;
    return { op, n, have, ok: have >= n };
  });
  const mixed = pickBuses(seats, pool);
  const byOp = { H: 0, M: 0, S: 0 }; mixed.buses.forEach((b) => byOp[b.op]++);

  if (seats >= slot.p90) return { cls: al.status === 'draft' ? 'info' : 'ok', text: `Covered${draft}` };

/* ---------- live map ---------- */
const mapState = { t0: performance.now(), raf: 0 };
function pathLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }
function pointAt(pts, f) {
  const L = pathLen(pts) * Math.min(1, Math.max(0, f)); let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const seg = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (acc + seg >= L) { const k = (L - acc) / seg; return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * k, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * k]; }
    acc += seg;
  }
  return pts[pts.length - 1];
}
function simNow() {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  return reduce ? DEMO_NOW : DEMO_NOW + ((performance.now() - mapState.t0) / 1000 * 0.6) % 40;
}
/** Buses on an active trip at time t: path fraction 0 = home end, 1 = DSC. */
function activeBuses(t) {
  const out = [];
  for (const s of slotsFor(0)) {
    const al = getAlloc(0, s.key);
    if (!al || al.status !== 'published') continue;
    const [w0, w1] = slotWindow(s);
    if (t < w0 || t > w1) continue;
    const x = (t - s.dep) / s.route.dur;
    al.buses.forEach((code, i) => {
      const lag = i * 0.05;
      let f;
      if (s.dir === 'to_campus') f = x - lag;
      else f = x <= 1 ? 1 - (x - lag) : (x - 1) - lag;
      if (s.dir === 'to_campus' && x > 1) return;
      out.push({ code, slot: s, f: Math.min(1, Math.max(0, f)), outbound: s.dir === 'from_campus' && x <= 1 });
    });
  }
  return out;
}
function mapSVG(opts) {
  const routes = opts.routes || ROUTES;
  const grid = [];
  for (let x = 40; x < 600; x += 40) grid.push(`<line class="grid" x1="${x}" y1="0" x2="${x}" y2="400"/>`);
  for (let y = 40; y < 400; y += 40) grid.push(`<line class="grid" x1="0" y1="${y}" x2="600" y2="${y}"/>`);
  const lines = routes.map((r) => `<polyline class="route-line ${opts.hl === r.id ? 'hl' : ''}" points="${r.path.map((p) => p.join(',')).join(' ')}"/>`).join('');
  const stops = routes.map((r) => r.path.slice(0, -1).map((p, i) => `<circle class="stop" cx="${p[0]}" cy="${p[1]}" r="${i === 0 ? 5 : 3.5}"/>`).join('')
    + `<text x="${r.path[0][0] + 8}" y="${r.path[0][1] + 4}">${esc(r.shuttle ? 'Sony' : r.name)}</text>`).join('');
  return `<svg class="map" viewBox="0 0 600 400" role="img" aria-label="Schematic map of routes into DSC with live bus positions">
    ${grid.join('')}
    <path class="river" d="M 30 390 C 110 320, 170 290, 214 228 S 300 70, 400 6"/>
    ${lines}${stops}
    <circle class="dsc" cx="120" cy="92" r="11"/><text x="74" y="72" style="font-weight:800;fill:var(--accent)">DSC · Ashulia</text>
    <g id="${opts.id}-buses"></g>
  </svg>`;
}
function drawBuses() {
  const t = simNow();
  const buses = activeBuses(t);
  document.querySelectorAll('[data-map]').forEach((wrap) => {
    const g = wrap.querySelector('g[id$="-buses"]');
    if (!g) return;
    const filterRoute = wrap.dataset.route;
    const q = (wrap.dataset.q || '').toUpperCase();
    const vis = buses.filter((b) => (!filterRoute || filterRoute === 'all' || b.slot.route.id === filterRoute) && (!q || b.code.includes(q)));
    g.innerHTML = vis.map((b) => {
      const [x, y] = pointAt(b.slot.route.path, b.f);
      return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><circle class="bus-dot" r="7" fill="var(--op-${b.code[0].toLowerCase()})"/><text class="bus-label" x="9" y="-7">${b.code}</text></g>`;
    }).join('');
    const list = wrap.querySelector('[data-buslist]');
    if (list) {
      list.innerHTML = vis.length ? vis.map((b) => {
        const km = Math.round(pathLen(b.slot.route.path) * (1 - b.f) / 14);
        return `<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)">${busChip(b.code)}<span class="small">${esc(routeLabel(b.slot))}</span><span class="small muted num">${km} km to DSC</span></div>`;
      }).join('') : '<p class="muted small">No bus on an active trip matches.</p>';
    }
    const clock = wrap.querySelector('[data-clock]');
    if (clock) clock.textContent = fmt(Math.floor(t));
  });
  mapState.raf = setTimeout(drawBuses, 250);
}

        <button class="btn ${p.addStudent ? '' : 'btn-primary'}" data-act="ph-add-student">${p.addStudent ? 'Remove from my dashboard' : 'Add to your dashboard'}</button>`;
    }
  }
  return '';
}
function notesHTML(role) {
  const p = state.phone[role];
  return `<div class="notes">
    <div class="card stack"><h2>${role === 'faculty' ? 'Faculty / admin staff app' : 'Student app'}</h2>
      <div class="row"><span class="muted small" style="font-weight:700">Show as</span>
        <div class="seg"><button data-act="ph-paid" data-role="${role}" data-v="1" aria-pressed="${p.paid}">Card holder (paid)</button><button data-act="ph-paid" data-role="${role}" data-v="0" aria-pressed="${!p.paid}">No card (free)</button></div></div>
      <p class="muted" style="margin:0">${state.preview === role ? 'Sample account shown to the authority for preview. ' : ''}Riders sign in with their own official DIU account. Profile (${role === 'faculty' ? 'department, ID, teacher initial, phone' : 'department, batch, section, phone'}) comes from the university database. Bus numbers come straight from what the authority published, so try changing an allocation in the dashboard and come back.</p></div>
    <div class="card stack"><h3>What changed from the sketch</h3><ul>
      <li>"Your bus" shows a countdown and switches to <b>To home</b> automatically in the afternoon.</li>
      <li>Bus numbers are chips coloured by operator (Hanif, Monir, Surjomukhi), grouped by operator as in the sketch.</li>
      <li>Free users keep the same home screen with times only, plus a clear "Get your card" action and the One Day Pass counter.</li>
      <li>My Card has a rotating QR that works offline, so supervisors can scan riders. Those scans train the prediction model.</li>
      ${role === 'faculty' ? '<li>Faculty see their own buses by default; the student schedule is in the side menu with "Add to your dashboard".</li>' : '<li>Shuttle (Sony → DSC) has its own card with the next trip and its route.</li>'}
      <li>Side menu has Bangla/English, contacts and support; notices arrive as push notifications.</li></ul></div>
  </div>`;
}
function renderPhone(role) {
  const banner = state.preview === role ? `<div class="day-banner" style="max-width:1180px;margin:16px auto 0;width:calc(100% - 32px)">${icon(ICONS.eye)}
    <span style="flex:1;min-width:220px">Authority preview with a sample account. Read-only: nothing can be applied, paid, sent or changed here, and real riders' apps cannot be opened.</span>
    <button class="btn btn-sm btn-primary" data-act="view" data-view="authority">Back to dashboard</button></div>` : '';
  $(`#view-${role}`).innerHTML = `${banner}<div class="app-stage">${phoneHTML(role)}${notesHTML(role)}</div>`;
  drawQR(role);
}

/* ---------- QR (sample pattern, not a real code) ---------- */
function drawQR(role) {
  const c = document.getElementById(`qr-${role}`); if (!c) return;
  const ctx = c.getContext('2d'); const N = 33; const seed = Math.floor(Date.now() / 30000);
  let x = (seed * 9301 + (role === 'faculty' ? 7 : 3) * 49297) % 233280;
  const rnd = () => { x = (x * 9301 + 49297) % 233280; return x / 233280; };
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, N, N); ctx.fillStyle = '#0e1a33';
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (rnd() > .52) ctx.fillRect(i, j, 1, 1);
  const finder = (fx, fy) => { ctx.fillStyle = '#fff'; ctx.fillRect(fx - 1, fy - 1, 9, 9); ctx.fillStyle = '#0e1a33'; ctx.fillRect(fx, fy, 7, 7); ctx.fillStyle = '#fff'; ctx.fillRect(fx + 1, fy + 1, 5, 5); ctx.fillStyle = '#0e1a33'; ctx.fillRect(fx + 2, fy + 2, 3, 3); };
  finder(1, 1); finder(N - 8, 1); finder(1, N - 8);
}
setInterval(() => {
  document.querySelectorAll('[data-qrtimer]').forEach((el) => { el.textContent = 30 - (Math.floor(Date.now() / 1000) % 30); });
  if (Math.floor(Date.now() / 1000) % 30 === 0) { drawQR('student'); drawQR('faculty'); }
}, 1000);

/* ---------- render + events ---------- */
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3200);
}
function render() {
  ['authority', 'student', 'faculty'].forEach((v) => { $(`#view-${v}`).hidden = state.view !== v; });
  document.querySelectorAll('.protobar [data-act="view"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
  if (state.view === 'authority') renderAuthority(); else renderPhone(state.view);
}
function setView(v) {
  state.view = v;
  try { if (location.hash !== `#${v}`) history.replaceState(null, '', `#${v}`); } catch (e) { /* hash routing is optional */ }
  render(); window.scrollTo(0, 0);
}
function saveAlloc(status) {
  const d = state.drawer, s = slotByKey(state.day, d.key);
  state.alloc[allocKey(state.day, d.key)] = { buses: [...d.sel], status, by: 'Anisur Rahman' };
  const msg = status === 'published' ? `Published · ${routeLabel(s)} ${fmt(s.dep)} · ${d.sel.size} bus${d.sel.size > 1 ? 'es' : ''} · riders notified` : `Draft saved · ${routeLabel(s)} ${fmt(s.dep)}`;
  if (status === 'published') state.feed.unshift({ time: '4:12 PM', text: `Allocation published · ${routeLabel(s)} · ${fmt(s.dep)} · ${[...d.sel].join(', ')}`, kind: 'info' });
  closeOverlays(); render(); toast(msg);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, role = t.dataset.role;
  const ph = role ? state.phone[role] : null;
  const WRITE_ACTIONS = ['ph-pay', 'ph-daypass', 'ph-submit', 'ph-add-student', 'ph-sheet'];
  if (state.preview && (role === state.preview || a === 'ph-add-student') && WRITE_ACTIONS.includes(a)) { toast('Read-only preview: nothing can be changed here'); return; }
  switch (a) {
    case 'view': closeOverlays(); state.preview = null; setView(t.dataset.view); break;
    case 'preview': state.preview = t.dataset.view; state.phone[t.dataset.view].screen = 'home'; setView(t.dataset.view); break;
    case 'ask-reason': askReason(t.dataset.kind, t.dataset.id || t.dataset.i); break;
    case 'confirm-reason': confirmReason(); break;
    case 'panel': state.panel = t.dataset.panel; render(); break;
    case 'aud': state.aud = t.dataset.v; render(); break;
    case 'dir': state.dir = t.dataset.v; render(); break;
    case 'ws': state.wsTab = t.dataset.tab; render(); break;
    case 'open7': open7(); break;
    case 'today': state.day = 0; render(); break;
    case 'goto-day': state.day = Number(t.dataset.day); state.panel = 'dashboard'; closeOverlays(); render(); toast(`Planning ${dayLabel(state.day)}`); break;
    case 'allocate': openAllocate(t.dataset.key); break;
    case 'toggle-bus': { const s = state.drawer.sel; s.has(t.dataset.code) ? s.delete(t.dataset.code) : s.add(t.dataset.code); renderDrawer(); break; }
    case 'use-suggestion': {
      const s = slotByKey(state.day, state.drawer.key);
      const pick = pickBuses(s.p90, freeBuses(state.day, s).concat([...state.drawer.sel].map((c) => FLEET.find((b) => b.code === c))).filter((b, i, arr) => arr.indexOf(b) === i));
      state.drawer.sel = new Set(pick.buses.map((b) => b.code)); renderDrawer(); break;
    }
    case 'clear-sel': state.drawer.sel = new Set(); renderDrawer(); break;
    case 'alloc-publish': saveAlloc('published'); break;
    case 'alloc-draft': saveAlloc('draft'); break;
    case 'alloc-delete': delete state.alloc[allocKey(state.day, state.drawer.key)]; closeOverlays(); render(); toast('Allocation deleted'); break;
    case 'close-overlays': closeOverlays(); break;
    case 'suggest-all': {
      let n = 0;
      [...slotsFor(state.day)].sort((x, y) => x.dep - y.dep).forEach((s) => {
        if (getAlloc(state.day, s.key)?.buses.length) return;
        const pick = pickBuses(s.p90, freeBuses(state.day, s));
        if (pick.buses.length) { state.alloc[allocKey(state.day, s.key)] = { buses: pick.buses.map((b) => b.code), status: 'draft', by: 'Model suggestion' }; n++; }
      });
      render(); toast(n ? `${n} empty slot${n > 1 ? 's' : ''} filled as drafts. Review, then publish.` : 'No empty slots left'); break;
    }
    case 'publish-day': {
      let n = 0; slotsFor(state.day).forEach((s) => { const al = getAlloc(state.day, s.key); if (al && al.status === 'draft') { al.status = 'published'; al.by = 'Anisur Rahman'; n++; } });
      render(); toast(`Published ${n} slot${n > 1 ? 's' : ''} for ${dayLabel(state.day)} · riders notified`); break;
    }
    case 'card-delete': { const c = state.cardReq.splice(Number(t.dataset.i), 1)[0]; render(); toast(`Request from ${c.name} deleted`); break; }
    case 'dp-approve': { const d = state.dayReq.splice(Number(t.dataset.i), 1)[0]; state.dayAuto.unshift({ ...d }); render(); toast(`${d.name}: extra day pass approved for ${d.date}`); break; }
    case 'dp-delete': { const d = state.dayReq.splice(Number(t.dataset.i), 1)[0]; render(); toast(`Day pass request from ${d.name} rejected`); break; }
    case 'ticket': { const list = t.dataset.list === 'help' ? state.help : state.complaints; const c = list[Number(t.dataset.i)]; c.unread = false; c.status = c.status === 'resolved' ? 'open' : 'resolved'; render(); break; }
    case 'pay-csv': savePayments('csv'); break;
    case 'pay-xlsx': savePayments('xlsx'); break;
    case 'pay-copy': copyPayments(); break;
    case 'logout': toast('Prototype: logout ends the session and revokes the refresh token'); break;
    case 'toast': toast(t.dataset.msg); break;
    /* phone */
    case 'ph-nav': ph.screen = t.dataset.s; ph.sheet = null; ph.menu = false; renderPhone(role); break;
    case 'ph-open-menu': ph.menu = true; renderPhone(role); break;
    case 'ph-close': ph.menu = false; ph.sheet = null; renderPhone(role); break;
    case 'ph-dir': ph.dir = t.dataset.v; renderPhone(role); break;
    case 'ph-service': state.phone.faculty.service = t.dataset.v; renderPhone('faculty'); break;
    case 'ph-paid': ph.paid = t.dataset.v === '1'; ph.screen = 'home'; ph.sheet = null; renderPhone(role); break;
    case 'ph-sheet': ph.sheet = t.dataset.sheet; renderPhone(role); break;
    case 'ph-pay': ph.paid = true; ph.sheet = 'paid'; renderPhone(role); break;
    case 'ph-daypass': { const v = $('#dp-date').value; ph.passLeft = 0; ph.passDate = v; ph.sheet = null; ph.screen = 'card'; renderPhone(role); toast(`One Day Pass approved for ${v}`); break; }
    case 'ph-submit': ph.sheet = null; renderPhone(role); toast(t.dataset.msg); break;
    case 'ph-add-student': state.phone.faculty.addStudent = !state.phone.faculty.addStudent; state.phone.faculty.sheet = null; renderPhone('faculty'); toast(state.phone.faculty.addStudent ? 'Student bus added to your dashboard' : 'Removed from your dashboard'); break;
    case 'ph-menu': {
      const [kind, val] = t.dataset.a.split(':');
      ph.menu = false;
      if (kind === 'sheet' && state.preview === role && val !== 'contact' && val !== 'studentsched') { toast('Read-only preview: nothing can be changed here'); renderPhone(role); break; }
      if (kind === 'screen') ph.screen = val; else if (kind === 'sheet') ph.sheet = val; else toast(val);
      renderPhone(role); break;
    }
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'people-q') { state.search = e.target.value; const pos = e.target.selectionStart; render(); const el = $('#people-q'); el.focus(); el.setSelectionRange(pos, pos); }
  if (e.target.id === 'live-q') { state.liveQuery = e.target.value; const w = e.target.closest('[data-map]'); if (w) w.dataset.q = e.target.value; }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'live-route') { state.liveFilter = e.target.value; render(); }
  if (e.target.id === 'pay-day') { state.payDay = e.target.value; render(); }
  if (e.target.id === 'pay-status') { state.payStatus = e.target.value; render(); }
  if (e.target.id === 'pay-method') { state.payMethod = e.target.value; render(); }
  if (e.target.id === 'a-preset') {
    const presets = { 'Allocation officer': ['predictions.view', 'allocation.manage', 'allocation.publish'], 'Card desk': ['cards.approve', 'daypass.approve', 'payments.view'], 'Support desk': ['support.manage', 'notices.publish'], Viewer: ['predictions.view', 'reports.view'] };
    document.querySelectorAll('input[name="perm"]').forEach((cb) => { cb.checked = (presets[e.target.value] || []).includes(cb.value); });
  }
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'notice-form') {
    const title = $('#n-title').value.trim(); if (!title) return;
    state.notices.unshift({ title, body: $('#n-body').value.trim() || 'See details in the app.', aud: $('#n-aud').value, time: 'Just now' });
    state.feed.unshift({ time: '4:12 PM', text: `Notice published · ${title}`, kind: 'info' });
    render(); toast('Notice published · push sent');
  }
  if (e.target.id === 'admin-form') {
    const perms = [...document.querySelectorAll('input[name="perm"]:checked')].map((c) => c.value);
    state.admins.push({ name: $('#a-name').value, id: $('#a-id').value, role: $('#a-preset').value === 'custom' ? 'Custom' : $('#a-preset').value, perms: perms.length ? perms : ['predictions.view'] });
    render(); toast('Co-admin added · invitation sent');
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeOverlays(); });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (['authority', 'student', 'faculty'].includes(v) && v !== state.view) { state.view = v; state.preview = null; render(); } });

const startView = location.hash.slice(1);
state.view = ['authority', 'student', 'faculty'].includes(startView) ? startView : 'authority';
render();
drawBuses();
(async () => {
  try { if (window.claude && typeof window.claude.use === 'function') downloadsApi = await window.claude.use('downloads'); } catch (e) { downloadsApi = null; }
  if (downloadsApi && state.view === 'authority' && state.panel === 'payments') render();
})();
</script>
