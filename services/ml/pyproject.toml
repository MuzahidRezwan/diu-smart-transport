[project]
name = "diu-transport-ml"
version = "0.1.0"
description = "DIU Smart Transport ML service: routine parsing, demand forecasting and bus allocation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pandas>=2.2,<4",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "pulp>=2.8,<4",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
